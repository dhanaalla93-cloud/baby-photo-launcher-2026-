name: Build Baby Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir BabyPhotoLauncher
          unzip BabyPhotoLauncher_Source.zip -d BabyPhotoLauncher

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle -p BabyPhotoLauncher assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baby-Photo-Launcher-APK
          path: BabyPhotoLauncher/app/build/outputs/apk/debug/app-debug.apk
